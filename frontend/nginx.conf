# PulseBoard frontend - nginx configuration
#
# Serves the built React SPA and proxies /api/ requests to the backend
# service. The backend address defaults to "backend", which matches the
# typical Kubernetes/VeloCore service name for the backend project in this
# repository. Change BACKEND_HOST below if your backend service is named
# differently.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the React single-page application
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend service
    location /api/ {
        proxy_pass http://pulseboard-backend-49ac2266:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Basic caching for static assets
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        access_log off;
    }
}
